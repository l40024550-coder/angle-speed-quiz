<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>각도 스피드 퀴즈</title>
<style>:root{--ink:#151a17;--cream:#fbf8ef;--green:#369466}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR","Segoe UI",sans-serif}.wrap{max-width:1120px;margin:auto;padding:24px}.brand{font-size:38px;font-weight:950;margin:5px 0}.sub{color:#505853;margin:0 0 18px}.card{background:#fff;border:1px solid #e7e5df;border-radius:22px;padding:24px;box-shadow:0 8px 28px #544f3b0c;margin:14px 0}.homegrid{display:grid;grid-template-columns:1fr 1fr;gap:18px}label{display:block;font-weight:800;margin:12px 0 6px}input{width:100%;padding:14px 16px;border:1px solid #dddcd7;border-radius:13px;font-size:17px}.btn{border:0;border-radius:14px;padding:15px 20px;font-weight:900;font-size:17px;background:var(--green);color:#fff;cursor:pointer}.btn.secondary{background:#edf5ef;color:#276c4a}.btn.danger{background:#fff0f0;color:#b42318}.hidden{display:none!important}.rank{width:100%;border-collapse:collapse}.rank td{padding:10px;border-bottom:1px solid #eee}.gamehead{display:grid;grid-template-columns:1fr auto 1fr;gap:14px;align-items:center;margin-bottom:14px}.mode,.timer,.score{border-radius:16px;padding:14px 20px;font-weight:900}.mode,.timer{background:#e9f4eb}.timer{font-size:32px;color:#14643f}.score{text-align:center;background:#f2f1ed}.timer.danger{background:#fff0f0;color:#b42318}.problem{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(280px,.75fr);gap:26px}.qmeta{display:flex;gap:10px;margin-bottom:10px}.tag{border-radius:12px;padding:8px 13px;font-weight:900;background:#ead7aa}.tag.blue{background:#d9ecfa;color:#174d7c}.qtitle{font-size:clamp(24px,3vw,35px);font-weight:950;margin:6px 0}.qdesc{font-size:18px;color:#4e5550;margin:0 0 8px}.figure{width:100%;display:block;max-height:510px}.choices{display:grid;gap:12px;align-content:start;padding-top:80px}.answer-label{font-size:18px;font-weight:900}.answer-input{font-size:30px!important;text-align:center;font-weight:900;padding:18px!important;border:2px solid #cfd5d0!important}.answer-input:focus{outline:3px solid #d9eee1;border-color:#369466!important}.answer-help{font-size:14px;color:#69716c;margin-top:-5px}.submit{margin-top:8px;width:100%;font-size:22px;padding:18px}.hint{margin-top:14px;background:#fffaf0;border:1px solid #f0e5cc;border-radius:15px;padding:14px 18px;font-size:16px;line-height:1.6}.feedback{text-align:center;min-height:30px;font-weight:900;margin-top:8px}.ok{color:#267b51}.bad{color:#bd3d3d}.center{text-align:center}.resultScore{font-size:60px;font-weight:950}.row{display:flex;gap:10px}.row>*{flex:1}@media(max-width:780px){.wrap{padding:12px}.homegrid,.problem{grid-template-columns:1fr}.choices{padding-top:0}.brand{font-size:30px}.gamehead{grid-template-columns:1fr 1fr}.mode{display:none}.figure{max-height:none}.card{padding:16px}}</style></head><body><main class="wrap">
<section id="home"><div class="brand">각도 스피드 퀴즈</div><p class="sub">도형을 보고, 생각하고, 도전하자!</p><div class="homegrid"><div class="card"><h2>참가하기</h2><label>학번</label><input id="studentNo" placeholder="예: 20301"><label>이름</label><input id="studentName" placeholder="이름"><br><br><button class="btn" id="startBtn">게임 시작</button></div><div class="card"><h2>🏆 TOP 5</h2><div id="rankStatus"></div><table class="rank"><tbody id="rankBody"></tbody></table></div></div><button class="btn secondary" id="adminBtn">관리자 화면</button></section>
<section id="admin" class="hidden"><div class="card center"><h2>관리자</h2><p>테스트는 30초이며 랭킹에 등록되지 않습니다.</p><div class="row"><button class="btn" id="testBtn">테스트 하기</button><button class="btn danger" id="resetBtn">랭킹 초기화 안내</button></div><p id="adminMsg"></p><button class="btn secondary" id="adminBack">처음으로</button></div></section>
<section id="game" class="hidden"><div class="gamehead"><div id="modePill" class="mode"></div><div id="timer" class="timer">05:00</div><div class="score">현재 점수 <b id="score">0</b></div></div><div class="card problem"><div><div class="qmeta"><span id="qnum" class="tag">문제</span><span id="qtype" class="tag blue"></span></div><div id="question" class="qtitle"></div><p class="qdesc">두 직선은 서로 평행하고, 한 직선이 두 직선을 가로지릅니다.</p><div id="figure"></div><div id="hint" class="hint"></div></div><div class="choices"><label class="answer-label" for="answerInput">정답 입력</label><input id="answerInput" class="answer-input" autocomplete="off" autocapitalize="off"><div id="answerHelp" class="answer-help"></div><button id="submitBtn" class="btn submit">정답 제출</button><div id="feedback" class="feedback"></div></div></div></section>
<section id="result" class="hidden"><div class="card center"><h2>게임 종료!</h2><div id="resultScore" class="resultScore"></div><p id="resultDetail"></p><p id="saveStatus"></p><button class="btn" id="homeBtn">처음으로</button></div></section></main>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";import{getFirestore,collection,addDoc,getDocs,query,orderBy,limit,serverTimestamp}from"https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyBMKRrclbtXrsSRZWSH4jUolMqVg6o8qxI",authDomain:"seoho1angle.firebaseapp.com",projectId:"seoho1angle",storageBucket:"seoho1angle.firebasestorage.app",messagingSenderId:"578868532521",appId:"1:578868532521:web:aadaa38346ed7db8439338"};const app=initializeApp(firebaseConfig),db=getFirestore(app),$=x=>document.getElementById(x),sections=["home","admin","game","result"];function show(id){sections.forEach(x=>$(x).classList.toggle("hidden",x!==id))}function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}async function loadRanks(){$("rankStatus").textContent="랭킹 불러오는 중…";$("rankBody").innerHTML="";try{const snap=await getDocs(query(collection(db,"scores"),orderBy("score","desc"),limit(5)));if(snap.empty){$("rankStatus").textContent="아직 등록된 기록이 없습니다.";return}$("rankStatus").textContent="";let n=0;snap.forEach(d=>{let x=d.data();$("rankBody").insertAdjacentHTML("beforeend",`<tr><td>${++n}</td><td>${esc(x.studentNo||"")}</td><td>${esc(x.name||"")}</td><td><b>${Number(x.score)||0}점</b></td></tr>`)})}catch(e){$("rankStatus").textContent="랭킹을 불러오지 못했습니다."}}
const L=['a','b','c','d','e','f','g','h'],slots=['a','b','c','d','e','f','g','h'];const baseCorr={a:'e',b:'f',c:'g',d:'h',e:'a',f:'b',g:'c',h:'d'},baseAlt={a:'g',b:'h',c:'e',d:'f',e:'c',f:'d',g:'a',h:'b'};const pos={a:[198,88],b:[302,76],c:[322,172],d:[205,187],e:[291,273],f:[395,261],g:[415,357],h:[298,372]};const arcs={a:'M214 130 A46 46 0 0 1 239.43 88.85',b:'M239.43 88.85 A46 46 0 0 1 306 130',c:'M306 130 A46 46 0 0 1 280.57 171.15',d:'M280.57 171.15 A46 46 0 0 1 214 130',e:'M306.5 315 A46 46 0 0 1 331.93 273.85',f:'M331.93 273.85 A46 46 0 0 1 398.5 315',g:'M398.5 315 A46 46 0 0 1 373.07 356.15',h:'M373.07 356.15 A46 46 0 0 1 306.5 315'};
function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
let cycleNo=0,questionTypeQueue=[],usedQuestionKeys=new Set(),slotToLabel={},labelToSlot={};
function newLabelMap(){const labels=shuffle(L);slotToLabel={};labelToSlot={};slots.forEach((s,i)=>{slotToLabel[s]=labels[i];labelToSlot[labels[i]]=s})}
function refillCycle(){cycleNo++;questionTypeQueue=shuffle([0,1,2,3]);newLabelMap()}
function nextQuestionType(){if(!questionTypeQueue.length)refillCycle();return questionTypeQueue.shift()}
function corrLabel(label){return slotToLabel[baseCorr[labelToSlot[label]]]}function altLabel(label){return slotToLabel[baseAlt[labelToSlot[label]]]}
function degreeForSlot(slot,acuteDegree){return ['a','c','e','g'].includes(slot)?acuteDegree:180-acuteDegree}
function randomAcute(){return Math.floor(Math.random()*61)+25}
function diagram(replacements={}){const angleArcs=slots.map(k=>`<path d="${arcs[k]}" fill="none" stroke="#555b57" stroke-width="2.5" stroke-linecap="round"/>`).join('');const texts=slots.map(slot=>{const label=Object.prototype.hasOwnProperty.call(replacements,slot)?`${replacements[slot]}°`:slotToLabel[slot];return `<text x="${pos[slot][0]}" y="${pos[slot][1]}" class="lab">${label}</text>`}).join('');return `<svg class="figure" viewBox="0 0 600 430" role="img"><style>.lab{font:italic 700 30px Georgia,serif;fill:#151515;text-anchor:middle;dominant-baseline:middle}</style><rect width="600" height="430" rx="20" fill="#fff"/><g stroke="#111" stroke-width="5" stroke-linecap="round"><line x1="55" y1="130" x2="545" y2="130"/><line x1="55" y1="315" x2="545" y2="315"/><line x1="205" y1="20" x2="400" y2="410"/></g>${angleArcs}${texts}</svg>`}
function makeSizeQuestion(type,target){const isCorr=type===2,targetSlot=labelToSlot[target],relationSlot=isCorr?baseCorr[targetSlot]:baseAlt[targetSlot],acute=randomAcute(),answer=degreeForSlot(targetSlot,acute),count=Math.min(cycleNo,4);let candidates=shuffle(slots.filter(s=>s!==targetSlot));if(!candidates.includes(relationSlot))candidates[0]=relationSlot;let chosen=[relationSlot,...candidates.filter(s=>s!==relationSlot)].slice(0,count);const replacements={};chosen.forEach(s=>replacements[s]=degreeForSlot(s,acute));return{key:`${isCorr?'corrSize':'altSize'}:${cycleNo}:${target}:${acute}:${chosen.slice().sort().join('')}`,target,ans:String(answer),kind:isCorr?'동위각의 크기':'엇각의 크기',numeric:true,q:`각 ${target}의 크기는?`,html:diagram(replacements),hint:isCorr?'평행선에서 동위각의 크기는 서로 같습니다.':'평행선에서 엇각의 크기는 서로 같습니다.'}}
function buildQuestion(type){const target=L[Math.floor(Math.random()*L.length)];if(type===0)return{key:`corr:${cycleNo}:${target}:${JSON.stringify(slotToLabel)}`,target,ans:corrLabel(target),kind:'동위각',numeric:false,q:`각 ${target}의 동위각은?`,html:diagram(),hint:'평행한 두 직선을 한 직선이 가로지를 때 같은 위치에 있는 두 각을 동위각이라고 합니다.'};if(type===1)return{key:`alt:${cycleNo}:${target}:${JSON.stringify(slotToLabel)}`,target,ans:altLabel(target),kind:'엇각',numeric:false,q:`각 ${target}의 엇각은?`,html:diagram(),hint:'평행한 두 직선을 한 직선이 가로지를 때 두 직선 사이에서 횡단선의 서로 반대쪽에 있는 각을 살펴보세요.'};return makeSizeQuestion(type,target)}
function makeQuestion(){const type=nextQuestionType();for(let tries=0;tries<300;tries++){const q=buildQuestion(type);if(!usedQuestionKeys.has(q.key)){usedQuestionKeys.add(q.key);return q}}throw new Error('새로운 문제를 생성하지 못했습니다.')}
let state={mode:'normal',seconds:300,score:0,correct:0,wrong:0,q:null,locked:false,timer:null,no:0,studentNo:'',name:''};function begin(mode){cycleNo=0;questionTypeQueue=[];usedQuestionKeys=new Set();newLabelMap();state={mode,seconds:mode==='test'?30:300,score:0,correct:0,wrong:0,q:null,locked:false,timer:null,no:0,studentNo:$("studentNo").value.trim(),name:$("studentName").value.trim()};show('game');$('modePill').textContent=mode==='test'?'테스트 | 30초':'본게임 | 5분';updateHud();nextQ();state.timer=setInterval(()=>{state.seconds--;updateHud();if(state.seconds<=0)finish()},1000)}function updateHud(){const m=Math.floor(state.seconds/60),s=state.seconds%60;$('timer').textContent=`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;$('timer').classList.toggle('danger',state.seconds<=30);$('score').textContent=state.score}function nextQ(){state.q=makeQuestion();state.no++;$('qnum').textContent=`문제 ${state.no}`;$('qtype').textContent=state.q.kind;$('question').textContent=state.q.q;$('figure').innerHTML=state.q.html;$('hint').innerHTML=`💡 <b>힌트</b><br>${state.q.hint}`;$('feedback').textContent='';$('answerInput').value='';$('answerInput').disabled=false;$('answerInput').maxLength=state.q.numeric?3:1;$('answerInput').inputMode=state.q.numeric?'numeric':'text';$('answerInput').placeholder=state.q.numeric?'숫자 입력':'a ~ h';$('answerHelp').textContent=state.q.numeric?'각의 크기를 숫자로 입력하세요. (°는 입력하지 않아도 됩니다.)':'a부터 h까지 한 글자를 입력하세요.';setTimeout(()=>$('answerInput').focus(),50)}function submit(){if(state.locked||!state.q)return;let v=$('answerInput').value.trim().toLowerCase().replace('°','');if(state.q.numeric){if(!/^\d{1,3}$/.test(v)){$('feedback').className='feedback bad';$('feedback').textContent='각의 크기를 숫자로 입력하세요.';return}}else if(!L.includes(v)){$('feedback').className='feedback bad';$('feedback').textContent='a부터 h까지 한 글자를 입력하세요.';return}if(v===state.q.ans){state.score++;state.correct++;$('feedback').textContent='정답! +1';$('feedback').className='feedback ok';updateHud();setTimeout(nextQ,350)}else{state.score-=2;state.wrong++;state.locked=true;$('answerInput').disabled=true;updateHud();let left=3;$('feedback').className='feedback bad';$('feedback').textContent=`오답! -2 · ${left}초 후 다시 도전`;const t=setInterval(()=>{left--;if(left>0)$('feedback').textContent=`오답! -2 · ${left}초 후 다시 도전`;else{clearInterval(t);state.locked=false;$('answerInput').disabled=false;$('answerInput').value='';$('feedback').textContent='같은 문제에 다시 도전하세요.';$('answerInput').focus()}},1000)}}async function finish(){if(state.timer)clearInterval(state.timer);state.timer=null;show('result');$('resultScore').textContent=`${state.score}점`;$('resultDetail').textContent=`정답 ${state.correct}개 · 오답 ${state.wrong}회`;if(state.mode==='test'){$('saveStatus').textContent='테스트 기록은 저장되지 않습니다.';return}$('saveStatus').textContent='기록 저장 중…';try{await addDoc(collection(db,'scores'),{studentNo:state.studentNo,name:state.name,score:state.score,correct:state.correct,wrong:state.wrong,mode:'normal',createdAt:Date.now(),serverCreatedAt:serverTimestamp()});$('saveStatus').textContent='랭킹에 기록을 저장했습니다.'}catch(e){$('saveStatus').textContent='기록 저장에 실패했습니다.'}}
$('startBtn').addEventListener('click',()=>{if(!$('studentNo').value.trim()||!$('studentName').value.trim()){alert('학번과 이름을 모두 입력하세요.');return}begin('normal')});$('submitBtn').addEventListener('click',submit);$('answerInput').addEventListener('input',e=>{if(state.q?.numeric)e.target.value=e.target.value.replace(/[^0-9]/g,'').slice(0,3);else e.target.value=e.target.value.toLowerCase().replace(/[^a-h]/g,'').slice(0,1)});$('answerInput').addEventListener('keydown',e=>{if(e.key==='Enter')submit()});$('adminBtn').addEventListener('click',()=>{const pw=prompt('관리자 암호를 입력하세요.');if(pw==='4550')show('admin');else if(pw!==null)alert('암호가 올바르지 않습니다.')});$('testBtn').addEventListener('click',()=>begin('test'));$('resetBtn').addEventListener('click',()=>{$('adminMsg').textContent='랭킹 초기화 기능은 데이터 삭제 권한을 확인한 뒤 실행해야 합니다.'});$('adminBack').addEventListener('click',()=>{show('home');loadRanks()});$('homeBtn').addEventListener('click',()=>{show('home');loadRanks()});loadRanks();
</script></body></html>
