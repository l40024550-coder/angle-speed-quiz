name: Replace degree label
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/replace-degree-label.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace degree display logic
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old="const texts=L.map(k=>`<text x=\"${pos[k][0]}\" y=\"${pos[k][1]}\" class=\"lab\">${k}</text>`).join('');const mark=given?`<text x=\"${pos[given][0]+(['a','d','e','h'].includes(given)?-48:48)}\" y=\"${pos[given][1]}\" class=\"deg\">${degree}°</text>`:'';"
          new="const texts=L.map(k=>{const label=(given===k&&degree!==null)?`${degree}°`:k;return `<text x=\"${pos[k][0]}\" y=\"${pos[k][1]}\" class=\"lab\">${label}</text>`}).join('');const mark='';"
          if old not in s:
              raise SystemExit('Target code not found')
          p.write_text(s.replace(old,new))
          PY
      - name: Commit fix
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add index.html
          git commit -m "Place degree value directly at angle label" || exit 0
          git push