name: Apply supplementary angle difficulty
on:
  push:
    paths:
      - '.github/workflows/apply-supplementary-angle-difficulty.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch size questions
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old="function makeSizeQuestion(type,target){const isCorr=type===2,targetSlot=labelToSlot[target],relationSlot=isCorr?baseCorr[targetSlot]:baseAlt[targetSlot],acute=randomAcute(),answer=degreeForSlot(targetSlot,acute),given=degreeForSlot(relationSlot,acute),replacements={};if(given!==answer)throw new Error('동위각/엇각 크기 생성 오류');replacements[relationSlot]=given;return{key:`${isCorr?'corrSize':'altSize'}:${cycleNo}:${target}:${acute}:${relationSlot}`,target,ans:String(answer),kind:isCorr?'동위각의 크기':'엇각의 크기',numeric:true,q:`각 ${target}의 크기는?`,html:diagram(replacements),hint:isCorr?'평행선에서 동위각의 크기는 서로 같습니다.':'평행선에서 엇각의 크기는 서로 같습니다.'}}"
          new="function makeSizeQuestion(type,target){const isCorr=type===2,targetSlot=labelToSlot[target],relationSlot=isCorr?baseCorr[targetSlot]:baseAlt[targetSlot],acute=randomAcute(),answer=degreeForSlot(targetSlot,acute),sameSlots=slots.filter(s=>s!==targetSlot&&degreeForSlot(s,acute)===answer),suppSlots=slots.filter(s=>s!==targetSlot&&degreeForSlot(s,acute)===180-answer),direct=Math.random()<.35;let givenSlot;if(direct){givenSlot=relationSlot}else{const candidates=suppSlots.filter(s=>s!==relationSlot);givenSlot=candidates[Math.floor(Math.random()*candidates.length)]}const given=degreeForSlot(givenSlot,acute),replacements={};if(direct&&given!==answer)throw new Error('동위각/엇각 직접 제시 오류');if(!direct&&given+answer!==180)throw new Error('보각 크기 생성 오류');if(acuteSlots.has(givenSlot)&&!(given<90)||!acuteSlots.has(givenSlot)&&!(given>90))throw new Error('예각/둔각 표시 오류');replacements[givenSlot]=given;return{key:`${isCorr?'corrSize':'altSize'}:${cycleNo}:${target}:${acute}:${givenSlot}:${direct}`,target,ans:String(answer),kind:isCorr?'동위각의 크기':'엇각의 크기',numeric:true,q:`각 ${target}의 크기는?`,html:diagram(replacements),hint:direct?(isCorr?'평행선에서 동위각의 크기는 서로 같습니다.':'평행선에서 엇각의 크기는 서로 같습니다.'):'주어진 각과 이웃한 각의 합이 180°가 되는 관계를 먼저 이용한 뒤, 동위각 또는 엇각의 성질을 이용해 보세요.'}}"
          if old not in s:
              raise SystemExit('target function not found')
          p.write_text(s.replace(old,new))
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m "Add supplementary-angle difficulty to size questions"
          git push
