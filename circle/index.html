<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>원의 성질 스피드 퀴즈</title><!-- deploy refresh --><style>
*{box-sizing:border-box}body{margin:0;background:#fbf8ef;color:#171b18;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif}.wrap{max-width:1080px;margin:auto;padding:22px}.brand{font-size:36px;font-weight:950}.sub{color:#59615c}.card{background:white;border:1px solid #e8e5dc;border-radius:22px;padding:22px;margin:14px 0;box-shadow:0 8px 25px #0000000a}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}label{display:block;font-weight:800;margin:10px 0 6px}input{width:100%;padding:14px;border:1px solid #d8d8d3;border-radius:12px;font-size:18px}.btn{border:0;border-radius:14px;padding:15px 20px;background:#369466;color:#fff;font-size:17px;font-weight:900}.secondary{background:#edf5ef;color:#276c4a}.hidden{display:none!important}.rank{width:100%;border-collapse:collapse}.rank td{padding:9px;border-bottom:1px solid #eee}.head{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center}.pill{padding:12px 18px;border-radius:15px;background:#e9f4eb;font-weight:900}.timer{font-size:30px;color:#14643f}.score{text-align:center}.problem{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(260px,.7fr);gap:22px}.q{font-size:30px;font-weight:950}.tag{display:inline-block;padding:7px 12px;border-radius:11px;background:#d9ecfa;color:#174d7c;font-weight:900;margin-right:7px}.fig{width:100%;max-height:500px}.answer{padding-top:70px}.answer input{font-size:30px;text-align:center;font-weight:900;border:2px solid #cfd5d0}.feedback{font-weight:900;text-align:center;min-height:30px;margin-top:10px}.bad{color:#b42318}.ok{color:#267b51}.hint{background:#fffaf0;border:1px solid #f0e5cc;border-radius:14px;padding:12px;margin-top:10px}.center{text-align:center}@media(max-width:760px){.wrap{padding:11px}.grid,.problem{grid-template-columns:1fr}.answer{padding-top:0}.brand{font-size:29px}}</style></head><body><main class="wrap">
<section id="home"><div class="brand">원의 성질 스피드 퀴즈</div><p class="sub">그림을 읽고 원의 성질을 적용해 보자!</p><div class="grid"><div class="card"><h2>참가하기</h2><label>학번</label><input id="no" placeholder="예: 10301"><label>이름</label><input id="name" placeholder="이름"><br><br><button class="btn" id="start">게임 시작</button></div><div class="card"><h2>🏆 TOP 5</h2><div id="rankStatus"></div><table class="rank"><tbody id="ranks"></tbody></table></div></div><button class="btn secondary" id="admin">관리자 화면</button></section>
<section id="adminPage" class="hidden"><div class="card center"><h2>관리자</h2><p>테스트는 30초이며 랭킹에 등록되지 않습니다.</p><button class="btn" id="test">테스트 하기</button> <button class="btn secondary" id="back">처음으로</button></div></section>
<section id="game" class="hidden"><div class="head"><div class="pill" id="mode"></div><div class="pill timer" id="timer">05:00</div><div class="pill score">현재 점수 <b id="score">0</b> · 건너뛰기 <b id="skipLeft">5</b>회</div></div><div class="card problem"><div><div><span class="tag" id="qn"></span><span class="tag" id="qt"></span></div><div class="q" id="question"></div><div id="figure"></div><div class="hint" id="hint"></div></div><div class="answer"><label>정답 입력</label><input id="ans" inputmode="numeric" placeholder="숫자 입력"><br><br><button class="btn" style="width:100%" id="submit">정답 제출</button><button class="btn secondary" style="width:100%;margin-top:10px" id="skip">건너뛰기 (-5점)</button><div id="fb" class="feedback"></div></div></div></section>
<section id="result" class="hidden"><div class="card center"><h2>게임 종료!</h2><div style="font-size:58px;font-weight:950" id="final"></div><p id="detail"></p><p id="save"></p><button class="btn" id="homeBtn">처음으로</button></div></section></main>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";import{getFirestore,collection,addDoc,getDocs,query,orderBy,limit,serverTimestamp}from"https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";
const app=initializeApp({apiKey:"AIzaSyBMKRrclbtXrsSRZWSH4jUolMqVg6o8qxI",authDomain:"seoho1angle.firebaseapp.com",projectId:"seoho1angle",storageBucket:"seoho1angle.firebasestorage.app",messagingSenderId:"578868532521",appId:"1:578868532521:web:aadaa38346ed7db8439338"}),db=getFirestore(app),$=x=>document.getElementById(x),secs=["home","adminPage","game","result"];function show(x){secs.forEach(s=>$(s).classList.toggle("hidden",s!==x))}function ri(a,b){return Math.floor(Math.random()*(b-a+1))+a}function pick(a){return a[Math.floor(Math.random()*a.length)]}function sh(a){a=[...a];for(let i=a.length-1;i;i--){let j=ri(0,i);[a[i],a[j]]=[a[j],a[i]]}return a}function esc(s){return String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]))}
const C='<circle cx="300" cy="220" r="155" fill="none" stroke="#111" stroke-width="4"/>';const T='<style>.l{font:700 24px Georgia,serif;fill:#111;text-anchor:middle;dominant-baseline:middle}.n{font:800 22px sans-serif;fill:#111;text-anchor:middle;dominant-baseline:middle}</style>';
function svg1(left,right){return `<svg class="fig" viewBox="0 0 600 440">${T}${C}<circle cx="300" cy="220" r="5"/><text class="l" x="282" y="205">O</text><line x1="170" y1="300" x2="430" y2="300" stroke="#111" stroke-width="4"/><line x1="300" y1="220" x2="300" y2="300" stroke="#111" stroke-width="4"/><path d="M300 282h18v18" fill="none" stroke="#111" stroke-width="3"/><text class="l" x="150" y="314">A</text><text class="l" x="450" y="314">B</text><text class="l" x="300" y="322">M</text>${left?`<text class="n" x="235" y="282">${left}</text>`:""}${right?`<text class="n" x="365" y="282">${right}</text>`:""}</svg>`}
function svg1py(r,d){return `<svg class="fig" viewBox="0 0 600 440">${T}${C}<circle cx="300" cy="220" r="5"/><text class="l" x="282" y="205">O</text><line x1="170" y1="300" x2="430" y2="300" stroke="#111" stroke-width="4"/><line x1="300" y1="220" x2="300" y2="300" stroke="#111" stroke-width="4"/><line x1="300" y1="220" x2="170" y2="300" stroke="#777" stroke-width="3"/><path d="M300 282h18v18" fill="none" stroke="#111" stroke-width="3"/><text class="l" x="150" y="314">A</text><text class="l" x="450" y="314">B</text><text class="l" x="300" y="322">M</text><text class="n" x="225" y="238">${r}</text><text class="n" x="315" y="265">${d}</text></svg>`}
function svg2(top,bottom,topHalf=false,bottomHalf=false){return `<svg class="fig" viewBox="0 0 600 440">${T}${C}<circle cx="300" cy="220" r="5"/><text class="l" x="285" y="205">O</text><line x1="165" y1="145" x2="435" y2="145" stroke="#111" stroke-width="4"/><line x1="150" y1="300" x2="450" y2="300" stroke="#111" stroke-width="4"/><line x1="300" y1="220" x2="300" y2="145" stroke="#111" stroke-width="3"/><line x1="300" y1="220" x2="300" y2="300" stroke="#111" stroke-width="3"/><path d="M300 163h18v-18M300 282h18v18" fill="none" stroke="#111" stroke-width="3"/><line x1="290" y1="180" x2="310" y2="180" stroke="#111" stroke-width="3"/><line x1="290" y1="260" x2="310" y2="260" stroke="#111" stroke-width="3"/><text class="l" x="145" y="132">A</text><text class="l" x="455" y="132">B</text><text class="l" x="130" y="315">C</text><text class="l" x="470" y="315">D</text>${top?`<text class="n" x="${topHalf?225:300}" y="120">${top}</text>`:""}${bottom?`<text class="n" x="${bottomHalf?225:300}" y="330">${bottom}</text>`:""}</svg>`}
function svg3py(op,r){return `<svg class="fig" viewBox="0 0 600 440">${T}${C}<circle cx="300" cy="220" r="5"/><text class="l" x="280" y="210">O</text><circle cx="510" cy="220" r="5"/><text class="l" x="535" y="220">P</text><line x1="510" y1="220" x2="390" y2="92" stroke="#111" stroke-width="4"/><line x1="300" y1="220" x2="390" y2="92" stroke="#777" stroke-width="3"/><path d="M382 104l12 9 9-12" fill="none" stroke="#111" stroke-width="3"/><text class="l" x="378" y="72">A</text><text class="n" x="405" y="190">${op}</text><text class="n" x="330" y="145">${r}</text></svg>`}
function svg3(up,down){return `<svg class="fig" viewBox="0 0 600 440">${T}${C}<circle cx="300" cy="220" r="5"/><text class="l" x="280" y="210">O</text><circle cx="510" cy="220" r="5"/><text class="l" x="535" y="220">P</text><line x1="510" y1="220" x2="390" y2="92" stroke="#111" stroke-width="4"/><line x1="510" y1="220" x2="390" y2="348" stroke="#111" stroke-width="4"/><line x1="300" y1="220" x2="390" y2="92" stroke="#777" stroke-width="2"/><line x1="300" y1="220" x2="390" y2="348" stroke="#777" stroke-width="2"/><path d="M382 104l12 9 9-12M382 336l12-9 9 12" fill="none" stroke="#111" stroke-width="3"/><text class="l" x="378" y="72">A</text><text class="l" x="378" y="370">B</text>${up?`<text class="n" x="460" y="137">${up}</text>`:""}${down?`<text class="n" x="460" y="303">${down}</text>`:""}</svg>`}
let cycle=0,queue=[],used=new Set();function type(){if(!queue.length){cycle++;queue=sh([0,1,2])}return queue.shift()}
function make(){for(let z=0;z<200;z++){let t=type(),q,lv=Math.min(cycle,5);
if(t===0){
 if(lv===1){let h=ri(4,24);q={k:`1a-${h}`,type:"현의 수직이등분",q:"BM의 길이는?",a:String(h),svg:svg1(h,""),hint:"원의 중심에서 현에 내린 수선은 그 현을 수직이등분합니다."}}
 else if(lv===2){let h=ri(5,20);q={k:`1b-${h}`,type:"현의 수직이등분",q:"AB의 길이는?",a:String(h*2),svg:svg1(h,""),hint:"M이 AB의 중점임을 이용해 현 전체의 길이를 구해 보세요."}}
 else {let triples=[[5,3,4],[10,6,8],[13,5,12],[13,12,5],[15,9,12],[17,8,15],[25,7,24],[25,15,20]],p=triples[ri(0,triples.length-1)],r=p[0],d=p[1],h=p[2];q={k:`1p-${lv}-${r}-${d}`,type:"피타고라스 + 현",q:lv===3?"AM의 길이는?":"AB의 길이는?",a:String(lv===3?h:h*2),svg:svg1py(r,d),hint:lv===3?"OA는 반지름이고 OM⊥AB입니다. 직각삼각형 OMA를 찾아보세요.":"먼저 직각삼각형 OMA에서 AM을 구한 뒤, 중심에서 현에 내린 수선의 성질을 이용하세요."}}
}else if(t===1){
 if(lv===1){let w=ri(8,30);q={k:`2a-${w}`,type:"같은 거리의 두 현",q:"CD의 길이는?",a:String(w),svg:svg2(w,""),hint:"중심으로부터 같은 거리에 있는 두 현의 길이는 같습니다."}}
 else if(lv===2){let h=ri(4,18);q={k:`2b-${h}`,type:"같은 거리의 두 현",q:"CD의 길이는?",a:String(h*2),svg:svg2(h,"",true,false),hint:"먼저 현 AB 전체의 길이를 구한 뒤, AB=CD를 이용하세요."}}
 else if(lv===3){let x=ri(3,12),add=ri(2,8),v=x+add;q={k:`2x-${x}-${add}`,type:"같은 거리의 두 현",q:"x의 값은?",a:String(x),svg:svg2(v,`x+${add}`),hint:"중심에서 두 현까지의 거리가 같으므로 두 현의 길이가 같습니다."}}
 else {let h=ri(5,18);q={k:`2m-${lv}-${h}`,type:"두 성질 연결",q:"CD의 길이는?",a:String(h*2),svg:svg2(h,"",true,false),hint:"위 현의 절반에서 전체 길이를 먼저 구한 뒤, 중심으로부터 같은 거리에 있는 두 현의 성질을 적용하세요."}}
}else{
 if(lv===1){let v=ri(6,35);q={k:`3a-${v}`,type:"두 접선",q:"PB의 길이는?",a:String(v),svg:svg3(v,""),hint:"원 밖의 한 점에서 원에 그은 두 접선의 길이는 같습니다."}}
 else if(lv<=3){let x=ri(4,18),add=ri(2,9),v=x+add;q={k:`3b-${lv}-${x}-${add}`,type:"두 접선 + 일차방정식",q:"x의 값은?",a:String(x),svg:svg3(v,`x+${add}`),hint:"PA=PB를 이용해 간단한 일차방정식을 세워 보세요."}}
 else {let x=ri(5,20),add=ri(2,9),v=x+add;q={k:`3c-${lv}-${x}-${add}`,type:"두 접선 응용",q:"x의 값은?",a:String(x),svg:svg3(v,`x+${add}`),hint:"원 밖의 한 점에서 원에 그은 두 접선의 길이가 같다는 성질을 이용하세요."}}
}if(q&&!used.has(q.k)){used.add(q.k);return q}}throw new Error("새 문제 생성 실패")}

let st={};function skip(){if(st.locked)return;if((st.skips||0)>=5){$("fb").className="feedback bad";$("fb").textContent="건너뛰기를 모두 사용했습니다.";return}st.score-=5;st.skips=(st.skips||0)+1;hud();$("fb").className="feedback bad";$("fb").textContent="건너뛰기 -5점";setTimeout(next,250)}function next(){st.q=make();st.n++;$("qn").textContent="문제 "+st.n;$("qt").textContent=st.q.type;$("question").textContent=st.q.q;$("figure").innerHTML=st.q.svg;$("hint").innerHTML="💡 <b>힌트</b><br>"+st.q.hint;$("ans").value="";$("ans").disabled=false;$("fb").textContent="";setTimeout(()=>$("ans").focus(),50)}function hud(){let m=Math.floor(st.sec/60),s=st.sec%60;$("timer").textContent=`${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;$("score").textContent=st.score;$("skipLeft").textContent=Math.max(0,5-(st.skips||0));$("skip").disabled=(st.skips||0)>=5;$("skip").textContent=(st.skips||0)>=5?"건너뛰기 사용 완료":`건너뛰기 (-5점) · ${Math.max(0,5-(st.skips||0))}회 남음`}function begin(test=false){cycle=0;queue=[];used=new Set();st={test,sec:test?30:300,score:0,ok:0,bad:0,skips:0,n:0,locked:false,no:$("no").value.trim(),name:$("name").value.trim()};show("game");$("mode").textContent=test?"테스트 | 30초":"본게임 | 5분";hud();next();st.timer=setInterval(()=>{st.sec--;hud();if(st.sec<=0)finish()},1000)}function submit(){if(st.locked)return;let v=$("ans").value.replace(/[^0-9]/g,"");if(!v)return;if(v===st.q.a){st.score++;st.ok++;$("fb").className="feedback ok";$("fb").textContent="정답! +1";hud();setTimeout(next,300)}else{st.score-=2;st.bad++;st.locked=true;$("ans").disabled=true;hud();let x=3;$("fb").className="feedback bad";$("fb").textContent=`오답! -2 · ${x}초 후 다시 도전`;let t=setInterval(()=>{x--;if(x)$("fb").textContent=`오답! -2 · ${x}초 후 다시 도전`;else{clearInterval(t);st.locked=false;$("ans").disabled=false;$("ans").value="";$("fb").textContent="같은 문제에 다시 도전하세요.";$("ans").focus()}},1000)}}async function finish(){clearInterval(st.timer);show("result");$("final").textContent=st.score+"점";$("detail").textContent=`정답 ${st.ok}개 · 오답 ${st.bad}회`;if(st.test){$("save").textContent="테스트 기록은 저장되지 않습니다.";return}$("save").textContent="기록 저장 중…";try{await addDoc(collection(db,"scores"),{studentNo:st.no,name:st.name,score:st.score,correct:st.ok,wrong:st.bad,skips:st.skips||0,mode:"circle",createdAt:Date.now(),serverCreatedAt:serverTimestamp()});$("save").textContent="랭킹에 기록했습니다.";await ranks()}catch(e){console.error(e);$("save").textContent="기록 저장에 실패했습니다."}}async function ranks(){try{let s=await getDocs(query(collection(db,"scores"),orderBy("score","desc"),limit(5)));$("ranks").innerHTML="";$("rankStatus").textContent=s.empty?"아직 기록이 없습니다.":"";let i=0;s.forEach(d=>{let x=d.data();$("ranks").insertAdjacentHTML("beforeend",`<tr><td>${++i}</td><td>${esc(x.studentNo||"")}</td><td>${esc(x.name||"")}</td><td><b>${Number(x.score)||0}점</b></td></tr>`)})}catch(e){console.error(e);$("rankStatus").textContent="랭킹을 불러오지 못했습니다."}}
$("start").onclick=()=>{if(!$("no").value.trim()||!$("name").value.trim())return alert("학번과 이름을 모두 입력하세요.");begin(false)};$("submit").onclick=submit;$("skip").onclick=skip;$("ans").onkeydown=e=>{if(e.key==="Enter")submit()};$("ans").oninput=e=>e.target.value=e.target.value.replace(/[^0-9]/g,"").slice(0,3);$("admin").onclick=()=>{let p=prompt("관리자 암호를 입력하세요.");if(p==="4550")show("adminPage");else if(p!==null)alert("암호가 올바르지 않습니다.")};$("test").onclick=()=>begin(true);$("back").onclick=()=>{show("home");ranks()};$("homeBtn").onclick=()=>{show("home");ranks()};ranks();
</script></body></html>
